
services:

  postgres_cpd:
    image: postgres:16
    container_name: postgres_cpd_dev

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cpd_db

    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_cpd:/var/lib/postgresql/data
    restart: unless-stopped

    networks:
      - metanet1

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_dev

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "8081:80"
    depends_on:
      - postgres_cpd
    networks:
      - metanet1

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    hostname: metabase

    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabaseappdb
      MB_DB_PORT: 5432
      MB_DB_USER: ${METABASE_DB_USER}
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_DB_HOST: postgres_metabase

    depends_on:
      - postgres_mb
    networks:
      - metanet1

    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5

  postgres_mb:
    image: postgres:16
    container_name: postgres_metabase
    hostname: postgres_metabase

    environment:
      POSTGRES_USER: ${METABASE_DB_USER}
      POSTGRES_DB: metabaseappdb
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD}

    ports:
      - "5434:5432"
    volumes:
      - pgdata_mb:/var/lib/postgresql/data
    networks:
      - metanet1

volumes:
  pgdata_cpd:
  pgdata_mb:

networks:
  metanet1:
    driver: bridge
    